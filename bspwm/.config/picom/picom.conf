# -------------------------
# Rounded Corners (Foundation)
# -------------------------

corner-radius = 10;

rounded-corners-exclude = [
  "window_type = 'desktop'",      # wallpaper
  "window_type = 'notification'", # dunst (handle later if needed)
  "class_g = 'i3lock'",
  "class_g = 'Polybar' && name = 'Polybar tray window'"
];

# -------------------------
# Shadows (Foundation)
# -------------------------

shadow = true;
shadow-radius = 24;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.55;

shadow-exclude = [
  "window_type = 'desktop'",
  "class_g = 'i3lock'",
  "class_g = 'Polybar' && name = 'Polybar tray window'",
  # "window_type = 'dropdown_menu'", # INCASE NEEDED IN FUTURE
  # "window_type = 'popup_menu'",
  # "window_type = 'menu'"
  "override_redirect = true"
];

# -------------------------
# Transparency (Sane Defaults)
# -------------------------

inactive-opacity = 0.90;
active-opacity = 1.0;
frame-opacity = 1.0;

opacity-rule = [
  "90:window_type = 'dock'",          # polybar
  "100:window_type = 'notification'",  # dunst
  "85:class_g = 'Rofi'",                # REQUIRED for blur to be visible
  "100:class_g = 'i3lock'",
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'zen'",
  "95:class_g = 'qBittorrent'",
  "100:class_g = 'vlc'",
  "100:window_type = 'dropdown_menu'", # INCASE NEEDED IN FUTURE
  "100:window_type = 'popup_menu'",
  "100:window_type = 'menu'"
];

# -------------------------
# Blur (Legacy-Compatible, Correct)
# -------------------------

blur = {
  method = "kernel";
  size = 10;
  deviation = 5.0;
};

blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
  "window_type = 'desktop'",       # wallpaper
  "window_type = 'notification'",  # dunst
  "class_g != 'Rofi'",
  "class_g = 'i3lock'",
  "class_g = 'Polybar' && name = 'Polybar tray window'"
];

